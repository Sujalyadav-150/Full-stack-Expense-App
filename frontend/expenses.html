<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">
    <header class="page-header">
      <div>
        <p class="eyebrow">Expense intelligence</p>
        <h1>Daily Expenses</h1>
        <p class="subtitle">Track spending while AI keeps your categories organised.</p>
      </div>
      <a class="text-link" href="leaderboard.html">Open full leaderboard</a>
    </header>

    <section class="dashboard-grid">
      <div class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">New entry</p>
            <h2>Add an expense</h2>
          </div>
          <span class="ai-mark">AI</span>
        </div>
        <form id="expenseForm">
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 450" required>
          <label for="description">What was it for?</label>
          <input id="description" type="text" placeholder="Lunch at Domino's" required>
          <p id="aiSuggestion" class="ai-suggestion" aria-live="polite">AI category will appear here.</p>
          <button type="submit">Add expense</button>
        </form>
      </div>

      <aside class="panel leaderboard-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Optimised ranking</p>
            <h2>Leaderboard</h2>
          </div>
          <span class="rank-icon">#1</span>
        </div>
        <p id="leaderboardMessage" class="muted"></p>
        <ol id="leaderboardPreview" class="leaderboard-list"></ol>
      </aside>
    </section>

    <section class="panel expense-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Your activity</p>
          <h2>Recent expenses</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Amount</th>
              <th>Description</th>
              <th>Category</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/expenses.js"></script>
</body>
</html>
