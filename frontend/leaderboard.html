<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Leaderboard - Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main class="container">
		<h1>Expense Leaderboard</h1>
		<p>Users ranked by total tracked expenses.</p>
		<p id="leaderboardMessage"></p>
		<table>
			<thead>
				<tr>
					<th>Rank</th>
					<th>Name</th>
					<th>Email</th>
					<th>Total Expense</th>
				</tr>
			</thead>
			<tbody id="leaderboardBody"></tbody>
		</table>
	</main>
	<script src="js/leaderboard.js"></script>
</body>
</html>
